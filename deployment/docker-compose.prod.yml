services:
  butterscout-api:
    # Use pre-built image from Docker Hub (pushed by CI/CD)
    image: sesametech/butterscout:latest
    container_name: butterscout-api
    restart: always
    ports:
      - "8000:8000"
    environment:
      # Service URLs (Note: Dokploy auto-generates Redis password)
      - BS_REDIS_URL=redis://default:${REDIS_PASSWORD:-changeme}@redis:6379/0
      - BS_SEARXNG_URL=http://searxng:8080
      - BS_CRAWL4AI_URL=http://crawl4ai:11235
      - BS_CRAWL4AI_API_TOKEN=${BS_CRAWL4AI_API_TOKEN:?Set BS_CRAWL4AI_API_TOKEN in .env (e.g. openssl rand -hex 32); Crawl4AI 0.9+ refuses API calls without it}
      
      # Cache configuration
      - BS_CACHE_TYPE=redis
      - BS_CACHE_TTL_SECONDS=3600
      
      # Rate limiting
      - BS_RATE_LIMIT_PER_HOUR=60
      - BS_API_KEY_RATE_LIMIT_PER_HOUR=600
      - BS_GLOBAL_RATE_LIMIT_PER_HOUR=10000
      
      # Search configuration
      - BS_MAX_RESULTS=10
      - BS_MAX_CONCURRENT_EXTRACTIONS=8
      - BS_EXTRACTION_TIMEOUT_MS=2500
      - BS_REQUEST_TIMEOUT_MS=6000
      
      # Fallback settings
      - BS_FALLBACK_ENABLED=true
      - BS_FALLBACK_TIMEOUT_MS=3000
      - BS_FALLBACK_MAX_WORKERS=2
      
      # Observability
      - BS_LOG_LEVEL=INFO
      - BS_ENABLE_METRICS=true
      - BS_HEALTH_TIMEOUT_MS=750
      
      # CORS
      - BS_CORS_ORIGINS=*
      
      # Generate a secure key in production!
      # - BS_API_KEY=${BS_API_KEY} 
    depends_on:
      redis:
        condition: service_healthy
      searxng:
        condition: service_healthy
      crawl4ai:
        condition: service_healthy
    networks:
      - butterscout-network
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1024M
        reservations:
          cpus: '0.5'
          memory: 256M
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    # Explicit healthcheck (also defined in Dockerfile, but here for visibility and tunability)
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/live"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  redis:
    image: valkey/valkey:8-alpine
    container_name: butterscout-redis
    restart: always
    # CACHE-ONLY CONFIGURATION (intentional design decision)
    # --save "" --appendonly no: Disables persistence for pure cache behavior
    # Why: Search results and rate limits are transient data, persistence not needed
    # Trade-off: Rate limits reset on restart (acceptable for this use case)
    # Volume: Mounted but unused (allows future persistence if needed)
    command: redis-server --save "" --appendonly no --maxmemory 512mb --maxmemory-policy allkeys-lru --loglevel warning --requirepass ${REDIS_PASSWORD:-changeme}
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-changeme}
    # Don't expose ports in production - services communicate via internal network
    ports: []
    volumes:
      - redis_data:/data
    networks:
      - butterscout-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    healthcheck:
      test: ["CMD", "redis-cli", "--pass", "${REDIS_PASSWORD:-changeme}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  searxng:
    # Pinned to specific version for production stability
    # Update: Check https://hub.docker.com/r/searxng/searxng/tags for latest
    image: searxng/searxng:2025.11.21-b876d0bed
    container_name: butterscout-searxng
    restart: always
    entrypoint: ["/etc/searxng/entrypoint.sh"]
    environment:
      - SEARXNG_BASE_URL=http://searxng:8080/
      # REQUIRED: Set in GitHub Secrets or environment
      - SEARXNG_SECRET_KEY=${SEARXNG_SECRET_KEY}
    volumes:
      - ../searxng-config:/etc/searxng
    networks:
      - butterscout-network
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1536M
        reservations:
          cpus: '0.25'
          memory: 512M
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  crawl4ai:
    # Pinned to specific version for production stability
    # Update: Check https://hub.docker.com/r/unclecode/crawl4ai/tags or https://github.com/unclecode/crawl4ai/releases
    image: unclecode/crawl4ai:0.9.6
    container_name: butterscout-crawl4ai
    volumes:
      # Upstream config with a short per-crawl deadline; see the file's header.
      - ../crawl4ai-config/config.yml:/app/config.yml:ro
    restart: always
    environment:
      # 0.9+ answers its API only with a token; Butterscout sends the same one.
      - CRAWL4AI_API_TOKEN=${BS_CRAWL4AI_API_TOKEN:?Set BS_CRAWL4AI_API_TOKEN in .env (e.g. openssl rand -hex 32); Crawl4AI 0.9+ refuses API calls without it}
    shm_size: "2gb"  # Important for browser automation
    networks:
      - butterscout-network
    deploy:
      resources:
        limits:
          cpus: '3.0'
          memory: 4096M
        reservations:
          cpus: '1.0'
          memory: 1024M
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:11235/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  butterscout-network:
    driver: bridge

volumes:
  redis_data:
