name: Deploy to Dokploy

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.production
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/butterscout:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Dokploy Deployment
        # Assuming Dokploy has a webhook trigger or similar mechanism.
        # If using a specific Dokploy action, replace this.
        # For now, we'll use a generic webhook call which is common for PaaS.
        run: |
          curl -X POST "${{ secrets.DOKPLOY_WEBHOOK_URL }}"
