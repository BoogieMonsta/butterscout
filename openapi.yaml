openapi: 3.1.0
info:
  title: Butterscout API
  version: 0.1.0
  description: API for search orchestration and content extraction via SearXNG and Crawl4AI.
servers:
  - url: http://localhost:8000
    description: Local development

paths:
  /api/v1/search:
    post:
      summary: Search and extract content
      operationId: search
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchRequest'
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '502': { $ref: '#/components/responses/BadGateway' }
        '504': { $ref: '#/components/responses/GatewayTimeout' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/v1/extract:
    post:
      summary: Extract content from one URL
      operationId: extract
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExtractRequest'
      responses:
        '200':
          description: Extracted page content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtractResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '502': { $ref: '#/components/responses/BadGateway' }
        '504': { $ref: '#/components/responses/GatewayTimeout' }
        '500': { $ref: '#/components/responses/InternalError' }

  /health:
    get:
      summary: Health check
      operationId: health
      responses:
        '200':
          description: All components healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: One or more components degraded/unhealthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

components:
  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Unauthorized
      headers:
        WWW-Authenticate:
          schema:
            type: string
          description: ApiKey realm="Butterscout API"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    RateLimited:
      description: Rate limit exceeded
      headers:
        Retry-After:
          schema:
            type: integer
            description: Seconds until allowed
        X-RateLimit-Limit:
          schema:
            type: integer
        X-RateLimit-Remaining:
          schema:
            type: integer
        X-RateLimit-Reset:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    BadGateway:
      description: Upstream error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    GatewayTimeout:
      description: Upstream timeout
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    ExtractRequest:
      type: object
      required: [url]
      properties:
        url:
          type: string
          format: uri
          maxLength: 2048
        extract_timeout_ms:
          type: integer
          minimum: 500
          maximum: 6000
          default: 2500
        max_characters:
          type: integer
          minimum: 1000
          maximum: 80000
          default: 50000

    ExtractResponse:
      type: object
      required: [url, canonical_url, title, content, metadata]
      properties:
        url:
          type: string
          format: uri
          maxLength: 2048
        canonical_url:
          type: string
          format: uri
          maxLength: 2048
        title:
          type: string
          maxLength: 500
        content:
          oneOf:
            - type: string
              maxLength: 80000
            - type: 'null'
        metadata:
          $ref: '#/components/schemas/ExtractMetadata'

    ExtractMetadata:
      type: object
      required: [domain, word_count, extracted_by, extraction_ok, extraction_time_ms]
      properties:
        domain:
          type: string
          format: hostname
          maxLength: 255
        word_count:
          type: integer
          minimum: 0
        extracted_by:
          type: string
          enum: [crawl4ai, trafilatura, none]
        extraction_ok:
          type: boolean
        extraction_error:
          oneOf:
            - type: string
            - type: 'null'
        extraction_time_ms:
          type: integer
          minimum: 0

    SearchRequest:
      type: object
      required: [query]
      properties:
        query:
          type: string
          minLength: 1
          maxLength: 512
        max_results:
          type: integer
          minimum: 1
          maximum: 25
          default: 10
        include_content:
          type: boolean
          default: true
        extract_timeout_ms:
          type: integer
          minimum: 500
          maximum: 6000
          default: 2500
        options:
          type: object
          properties:
            domains:
              oneOf:
                - type: array
                  maxItems: 20
                  items:
                    type: string
                    format: hostname
                    maxLength: 255
                - type: 'null'
              default: null
            exclude_domains:
              oneOf:
                - type: array
                  maxItems: 20
                  items:
                    type: string
                    format: hostname
                    maxLength: 255
                - type: 'null'
              default: null
            freshness_days:
              oneOf:
                - type: integer
                  minimum: 1
                - type: 'null'
              default: null
            language:
              oneOf:
                - type: string
                  pattern: '^[a-z]{2}$'
                  maxLength: 2
                - type: 'null'
              default: 'en'

    SearchResponse:
      type: object
      required: [query, results, metadata]
      properties:
        query:
          type: string
          maxLength: 512
        results:
          type: array
          maxItems: 25
          items:
            $ref: '#/components/schemas/SearchResult'
        metadata:
          $ref: '#/components/schemas/ResponseMetadata'

    SearchResult:
      type: object
      required: [title, url, snippet, metadata, scores, source]
      properties:
        title:
          type: string
          maxLength: 500
        url:
          type: string
          format: uri
          maxLength: 2048
        snippet:
          type: string
          maxLength: 1000
        content:
          oneOf:
            - type: string
              maxLength: 50000
            - type: 'null'
        metadata:
          type: object
          required: [domain, extraction_ok]
          properties:
            domain:
              type: string
              format: hostname
              maxLength: 255
            word_count:
              oneOf:
                - type: integer
                  minimum: 0
                - type: 'null'
            extracted_by:
              oneOf:
                - type: string
                  enum: [crawl4ai, fallback, none]
                - type: 'null'
            extraction_ok:
              type: boolean
            extraction_error:
              oneOf:
                - type: string
                  enum: [timeout, network_error, parse_error, blocked]
                - type: 'null'
            content_truncated:
              type: boolean
              default: false
              description: True when content was clipped to the 50000-character limit.
        scores:
          type: object
          required: [search_score, rank]
          properties:
            search_score:
              type: number
              minimum: 0
              maximum: 1
            rank:
              type: integer
              minimum: 1
        source:
          type: string
          enum: [searxng]

    ResponseMetadata:
      type: object
      required: [search_time_ms, cache_hit, sources_queried, api_version, rate_limited]
      properties:
        search_time_ms:
          type: integer
          minimum: 0
        searxng_time_ms:
          oneOf:
            - type: integer
              minimum: 0
            - type: 'null'
        extraction_time_ms:
          oneOf:
            - type: integer
              minimum: 0
            - type: 'null'
        cache_hit:
          type: boolean
        sources_queried:
          type: array
          minItems: 1
          items:
            type: string
            enum: [searxng]
        api_version:
          type: string
          pattern: '^v[0-9]+$'
        rate_limited:
          type: boolean

    ErrorResponse:
      type: object
      required: [error, status, timestamp, request_id]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                - validation_error
                - authentication_failed
                - forbidden
                - rate_limit_exceeded
                - internal_error
                - upstream_timeout
                - upstream_error
            message:
              type: string
              maxLength: 500
            details:
              oneOf:
                - type: object
                - type: 'null'
            retry_after_ms:
              oneOf:
                - type: integer
                  minimum: 0
                - type: 'null'
        status:
          type: integer
          enum: [400, 401, 403, 429, 500, 502, 503, 504]
        timestamp:
          type: string
          format: date-time
        request_id:
          type: string
          format: uuid

    HealthResponse:
      type: object
      required: [status, components, version, timestamp, uptime_seconds]
      properties:
        status:
          type: string
          enum: [ok, degraded, unhealthy]
        components:
          type: object
          required: [searxng, crawl4ai, valkey]
          properties:
            searxng:
              $ref: '#/components/schemas/ComponentHealth'
            crawl4ai:
              $ref: '#/components/schemas/ComponentHealth'
            valkey:
              $ref: '#/components/schemas/ComponentHealth'
        version:
          type: string
          pattern: '^[0-9]+\.[0-9]+\.[0-9]+$'
        timestamp:
          type: string
          format: date-time
        uptime_seconds:
          type: integer
          minimum: 0

    ComponentHealth:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, degraded, unhealthy]
        latency_ms:
          oneOf:
            - type: integer
              minimum: 0
            - type: 'null'
        error:
          oneOf:
            - type: string
              maxLength: 200
            - type: 'null'
        last_success:
          oneOf:
            - type: string
              format: date-time
            - type: 'null'
