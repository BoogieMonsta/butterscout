services:
  butterscout-api:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: butterscout-api
    ports:
      - "8000:8000"
    environment:
      # Service URLs
      BS_SEARXNG_URL: ${BS_SEARXNG_URL:-http://searxng:8080}
      BS_CRAWL4AI_URL: ${BS_CRAWL4AI_URL:-http://crawl4ai:11235}
      BS_CRAWL4AI_API_TOKEN: ${BS_CRAWL4AI_API_TOKEN:?Set BS_CRAWL4AI_API_TOKEN in .env (e.g. openssl rand -hex 32); Crawl4AI 0.9+ refuses API calls without it}
      BS_REDIS_URL: ${BS_REDIS_URL:-redis://redis:6379/0}

      # Authentication (optional)
      BS_API_KEY: ${BS_API_KEY:-}

      # Cache settings
      BS_CACHE_TTL_SECONDS: ${BS_CACHE_TTL_SECONDS:-3600}

      # Rate limiting
      BS_RATE_LIMIT_PER_HOUR: ${BS_RATE_LIMIT_PER_HOUR:-60}
      BS_API_KEY_RATE_LIMIT_PER_HOUR: ${BS_API_KEY_RATE_LIMIT_PER_HOUR:-600}
      BS_GLOBAL_RATE_LIMIT_PER_HOUR: ${BS_GLOBAL_RATE_LIMIT_PER_HOUR:-10000}

      # Search settings
      BS_MAX_RESULTS: ${BS_MAX_RESULTS:-10}

      # Extraction settings
      # Crawl4AI pages in flight across all requests: ~2 per Crawl4AI CPU (4 CPUs below).
      BS_MAX_CONCURRENT_EXTRACTIONS: ${BS_MAX_CONCURRENT_EXTRACTIONS:-8}
      BS_EXTRACTION_TIMEOUT_MS: ${BS_EXTRACTION_TIMEOUT_MS:-2500}
      BS_FALLBACK_ENABLED: ${BS_FALLBACK_ENABLED:-true}
      BS_FALLBACK_TIMEOUT_MS: ${BS_FALLBACK_TIMEOUT_MS:-3000}
      BS_FALLBACK_MAX_WORKERS: ${BS_FALLBACK_MAX_WORKERS:-2}
      BS_REQUEST_TIMEOUT_MS: ${BS_REQUEST_TIMEOUT_MS:-6000}

      # Observability
      BS_LOG_LEVEL: ${BS_LOG_LEVEL:-info}
      BS_ENABLE_METRICS: ${BS_ENABLE_METRICS:-true}

      # Health check
      BS_HEALTH_TIMEOUT_MS: ${BS_HEALTH_TIMEOUT_MS:-750}

      # Domain filtering
      BS_ALLOWED_DOMAINS: ${BS_ALLOWED_DOMAINS:-}
      BS_BLOCKED_DOMAINS: ${BS_BLOCKED_DOMAINS:-}

      # CORS (comma-separated origins)
      BS_CORS_ORIGINS: ${BS_CORS_ORIGINS:-*}

      # MCP Streamable HTTP endpoint at /mcp (off unless enabled)
      BS_MCP_ENABLED: ${BS_MCP_ENABLED:-false}
      BS_MCP_ALLOWED_HOSTS: ${BS_MCP_ALLOWED_HOSTS:-localhost:*,127.0.0.1:*,[::1]:*}
      BS_MCP_ALLOWED_ORIGINS: ${BS_MCP_ALLOWED_ORIGINS:-}

    depends_on:
      searxng:
        condition: service_healthy
      crawl4ai:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - butterscout-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1536M
        reservations:
          cpus: '0.5'
          memory: 512M
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    # Explicit healthcheck (also defined in Dockerfile, but here for visibility)
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/live"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  searxng:
    image: searxng/searxng:latest
    container_name: butterscout-searxng
    entrypoint: ["/etc/searxng/entrypoint.sh"]
    environment:
      - BASE_URL=http://searxng:8080/
      - INSTANCE_NAME=butterscout-searxng
      # Auto-generates secret if not set (dev fallback)
      - SEARXNG_SECRET_KEY=${SEARXNG_SECRET_KEY:-}
    ports:
      - "8080:8080"
    volumes:
      - ./searxng-config:/etc/searxng:rw
      - searxng-data:/var/lib/searxng
    networks:
      - butterscout-network
    restart: unless-stopped
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M
        reservations:
          cpus: '0.25'
          memory: 256M
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  crawl4ai:
    # Using the official Crawl4AI Docker image
    # Ref: https://github.com/unclecode/crawl4ai
    # Pinned: Crawl4AI 0.9 changed its API defaults (token required, loopback-only
    # without one), and Butterscout's client targets 0.9's POST /crawl. Bump on purpose.
    image: unclecode/crawl4ai:0.9.5
    container_name: butterscout-crawl4ai
    volumes:
      # Upstream config with a short per-crawl deadline; see the file's header.
      - ./crawl4ai-config/config.yml:/app/config.yml:ro
    environment:
      CRAWL4AI_API_TOKEN: ${BS_CRAWL4AI_API_TOKEN:?Set BS_CRAWL4AI_API_TOKEN in .env (e.g. openssl rand -hex 32); Crawl4AI 0.9+ refuses API calls without it}
    ports:
      - "11235:11235"
    shm_size: "2gb"  # Important for browser automation
    networks:
      - butterscout-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          # Measured 2026-11-19: 4 pages at a time on 4 CPUs kept 88% of pages inside the
          # 2.5 s budget (median 1.2 s) and peaked at 1.6 GiB. On 1 CPU / 1 GiB it fell over.
          cpus: '4.0'
          memory: 3072M
        reservations:
          cpus: '0.5'
          memory: 512M
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    # Liveness only. Butterscout's own /health renders a page through a real browser.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:11235/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  redis:
    image: valkey/valkey:8-alpine
    container_name: butterscout-redis
    # Cache-only configuration (intentional)
    # - No persistence: --save "" --appendonly no
    # - LRU eviction: Automatically evicts old entries when memory is full
    # - Rate limits are ephemeral: Reset on container restart (acceptable trade-off)
    # - Volume mounted for potential persistence if needed in future
    command:
      - redis-server
      - --save ""
      - --appendonly no
      - --maxmemory 512mb
      - --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - butterscout-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

networks:
  butterscout-network:
    driver: bridge

volumes:
  redis_data:
  searxng-data:
